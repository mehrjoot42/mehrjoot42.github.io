<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت احمد مهرجو</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- تعریف پالت رنگی --- */
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --primary: #6366f1;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 2.5vh;
        }

        .box {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- ردیف اول: هدر --- */
        .header-row {
            display: flex;
            gap: 2.5vh;
            height: 25vh;
        }

        .profile-box {
            width: 15%;
            border: 3px solid var(--primary);
            background-color: #f8fafc;
        }

        .welcome-box {
            flex-grow: 1;
            font-size: 2vw;
            font-weight: 900;
            line-height: 1.8;
            padding: 2vw;
            color: var(--text-dark);
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome-box span {
            color: var(--primary);
            font-size: 1.2vw;
            font-weight: 700;
            display: block;
            margin-top: 10px;
        }

        /* --- ردیف‌های کارت‌ها --- */
        .cards-row {
            display: flex;
            gap: 2.5vh;
            height: 32vh;
        }

        .gif-box {
            width: 15%;
            background-color: #f8fafc;
        }

        .course-box {
            flex: 1;
            font-size: 1.5vw;
            font-weight: 700;
            text-decoration: none;
            color: var(--text-dark);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .course-box:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            color: var(--primary);
        }

        .course-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: var(--primary);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .course-box:hover::before {
            transform: scaleX(1);
        }

        /* ========================================= */
        /* --- تنظیمات موبایل (ریسپانسیو) --- */
        /* ========================================= */
        @media (max-width: 768px) {
            body {
                padding: 15px;
                align-items: flex-start;
            }

            .container {
                gap: 15px;
            }

            .header-row {
                flex-direction: column;
                height: auto;
                gap: 15px;
            }

            .profile-box {
                width: 100%;
                height: 200px;
            }

            .welcome-box {
                font-size: 20px;
                padding: 20px;
                line-height: 1.6;
            }

            .welcome-box span {
                font-size: 16px;
                margin-top: 8px;
            }

            .cards-row {
                flex-direction: column;
                height: auto;
                gap: 15px;
            }

            .gif-box {
                width: 100%;
                height: 200px;
            }

            .course-box {
                width: 100%;
                height: 80px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ردیف اول: عکس پروفایل و متن خوش‌آمدگویی -->
        <div class="header-row">
            <div class="box profile-box">
                <img src="1.jpg" alt="عکس احمد مهرجو">
            </div>
            <div class="box welcome-box">
                به سایت احمد مهرجو خوش آمدید
                <span>مدرس : دانشگاه اسلامشهر خوش تمدید</span>
            </div>
        </div>

        <!-- ردیف دوم: گیف اول و 4 کارت آموزشی -->
        <div class="cards-row">
            <div class="box gif-box">
                <img src="2.jpg" alt="فایل متحرک 2">
            </div>
            <a href="#" class="box course-box">آموزش ساخت گیف</a>
            <a href="#" class="box course-box">آموزش ساخت تصویر</a>
            <!-- دکمه لینک‌دار به یوتیوب (در تب جدید باز می‌شود) -->
            <a href="https://www.youtube.com/watch?v=SQpz1R7FsQk" target="_blank" class="box course-box">آموزش ساخت ویدیو</a>
            <a href="#" class="box course-box">آموزش تبدیل متن به گفتار</a>
        </div>

        <!-- ردیف سوم: گیف دوم و 4 کارت آموزشی -->
        <div class="cards-row">
            <div class="box gif-box">
                <img src="1.gif" alt="فایل متحرک 1">
            </div>
            <a href="#" class="box course-box">آموزش تبدیل گفتار به متن</a>
            <a href="#" class="box course-box">آموزش ساخت تصویر</a>
            <!-- دکمه لینک‌دار به یوتیوب (در تب جدید باز می‌شود) -->
            <a href="https://www.youtube.com/watch?v=SQpz1R7FsQk" target="_blank" class="box course-box">آموزش ساخت ویدیو</a>
            <a href="#" class="box course-box">آموزش پریمریر</a>
        </div>

    </div>

</body>
</html>
