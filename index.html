<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت احمد مهرجو</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --primary: #6366f1;
            --success: #10b981;
            --youtube: #ef4444;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.1rem;
            color: #64748b;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .card.new-version {
            border-top: 4px solid var(--success);
        }
        .card.new-version:hover {
            border-color: var(--success);
            color: var(--success);
        }
        .card.video {
            border-top: 4px solid var(--youtube);
        }
        .card.video:hover {
            border-color: var(--youtube);
            color: var(--youtube);
        }
        .card.old-version {
            border-top: 4px solid #94a3b8;
        }
        .card.old-version:hover {
            border-color: #94a3b8;
            color: #64748b;
        }
        .icon {
            font-size: 2.5rem;
        }
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>به سایت احمد مهرجو خوش آمدید</h1>
        <p>مدرس : دانشگاه اسلامشهر خوش آمدید</p>
    </div>

    <div class="container">
        <!-- دکمه ۱: دانلود نسخه جدید -->
        <a href="لینک_فایل_EXE_جدید_را_اینجا_بگذارید" class="card new-version">
            <span class="icon">⬇️</span>
            <span>دانلود نسخه جدید</span>
        </a>

        <!-- دکمه ۲: ویدیو آموزشی نسخه جدید -->
        <a href="https://www.youtube.com/watch?v=DUrfPFFD6wU" target="_blank" class="card video">
            <span class="icon">▶️</span>
            <span>ویدیو آموزشی نسخه جدید</span>
        </a>

        <!-- دکمه ۳: دانلود نسخه قبلی -->
        <a href="لینک_فایل_قدیمی_را_اینجا_بگذارید" class="card old-version">
            <span class="icon">📁</span>
            <span>دانلود نسخه قبلی</span>
        </a>
    </div>

</body>
</html>
